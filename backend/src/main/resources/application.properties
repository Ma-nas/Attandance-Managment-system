spring.application.name=backend

# Server Configuration (Dynamically binds to cloud port or defaults to 8081)
server.port=${PORT:8081}

# PostgreSQL Database Configuration (Dynamically binds to cloud DB or defaults to localhost)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ams_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ams_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ams_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection Pooling & Keepalive
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
